[Output Configuration]
undo_levels = 1000
space_placement = Before Output
start_attached = True

[Logging Configuration]
log_file = ~/Desktop/strokes.log
enable_stroke_logging = True
enable_translation_logging = True

[Stroke Display]
show = True

[Suggestions Display]
show = True

[Translation Frame]
opacity = 100

[Machine Configuration]
auto_start = True
machine_type = Plover HID

[Gemini PR]
baudrate = 9600
bytesize = 8
parity = N
port = /dev/cu.usbmodem104
stopbits = 1
timeout = 1.3

[System]
name = Lapwing

[Plugins]
enabled_extensions = ["modal_update", "plover_auto_reconnect_machine", "plover_engine_server", "plover_tapey_tape", "plover_websocket_server"]

[System: Lapwing]
dictionaries = [{"enabled": true, "path": "~/plover-config/plover/user.json"}, {"enabled": true, "path": "~/plover-config/plover/Harri_numbers.py"}, {"enabled": true, "path": "~/plover-config/plover/jeff-modifiers.py"}, {"enabled": true, "path": "~/plover-config/plover/jeff-phrasing.py"}, {"enabled": true, "path": "~/plover-config/plover/emily-symbols.py"}, {"enabled": true, "path": "~/plover-config/plover/lapwing-base.json"}, {"enabled": false, "path": "~/plover-config/plover/lapwing-commands.json"}, {"enabled": true, "path": "~/plover-config/plover/lapwing-commands-mac.json"}, {"enabled": true, "path": "~/plover-config/plover/lapwing-numbers.json"}, {"enabled": true, "path": "~/plover-config/plover/lapwing-proper-nouns.json"}, {"enabled": true, "path": "~/plover-config/plover/lapwing-uk-additions.json"}, {"enabled": false, "path": "~/plover-config/plover/return-from-raw.json"}]

[System: English Stenotype]
dictionaries = [{"enabled": false, "path": "user.json"}, {"enabled": false, "path": "commands.json"}, {"enabled": false, "path": "main.json"}]

[Plover HID]
device_scan_interval_ms = 1000
double_tap_repeat = True
first_up_chord_send = True
repeat_delay_ms = 200
repeat_interval_ms = 30

[SVG Layout Display]
layout = :/svgld/en_layout.svg
script = :/svgld/en_convert.py

